services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: daytrader
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://trader:trader@db:5432/daytrader
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: dev-secret-change-in-prod
      SEC_USER_AGENT: DayTraderWeb you@example.com
    depends_on:
      - db
      - redis
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://trader:trader@db:5432/daytrader
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend
    command: python -m backend.workers.main

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000

volumes:
  pgdata:
